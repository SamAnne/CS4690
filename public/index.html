<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <title>Student Logs</title>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://cdn.sstatic.net/Sites/stackoverflow/Img/favicon.ico"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Rajdhani:400,500,600,700|Raleway:400,500,600,700,800,900|Lato:400,500,600,700,800,900|Montserrat:400,500,600,700,800,900"
    />
    <link rel="icon" type="image/png" href="https://www.uvu.edu/favicon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- For the chrome flashbang -->
    <script>
      if (localStorage.getItem('displayPref')) {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('displayPref')
        );
      } else {
        const theme = window.matchMedia('(prefers-color-scheme: light)').matches
          ? 'light'
          : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('displayPref', theme);
      }
    </script>
  </head>
  <body onload="onPageLoad()" id="body">
    <div id="topbar">
      <img
        src="https://www.uvu.edu/sbdc/images/logos/uvu-logo-green.png"
        id="top-image"
        class="topitem"
      />
      <a class="UVUtitle topitem" href="">Student Logs</a>
      <span class="UVUtitle" id="lightordark">Light mode</span>
      <label class="toggle">
        <input
          type="checkbox"
          id="dark_light"
          name="dark_light"
          onchange="setMode(this)"
        />
        <span class="slider"></span>
      </label>
    </div>
    <div id="container">
      <form>
        <label for="course">Select a course</label><br />
        <select
          aria-label="Select Course"
          id="course"
          name="course"
          data-cy="course_select"
          onchange="displayUVUID(value)"
        ></select>
        <br />
        <label for="uvuId">UVU ID</label><br />

        <!-- onput here makes it so only numbers are typed -->
        <input
          type="text"
          id="uvuId"
          name="uvuId"
          data-cy="uvuId_input"
          oninput="this.value = this.value.replace(/[^0-9]/g, '');"
          maxlength="8"
          placeholder="10234567"
        />

        <h3 id="uvuIdDisplay" data-cy="uvuIdDisplay">Student Logs for</h3>
        <ul data-cy="logs" id="logs" onclick="hideLog(this)" class="list"></ul>
        <div id="bottom">
          <label>New Log</label><br />
          <textarea
            style="height: 75px"
            aria-label="add log textarea"
            data-cy="log_textarea"
            id="logText"
            oninput="postLog()"
          ></textarea
          ><br />

          <button
            type="submit"
            data-cy="add_log_btn"
            onclick="submitButton(event)"
            id="submit"
          >
            Add Log
          </button>
        </div>
      </form>
      <script src="script.js"></script>
    </div>
  </body>
</html>
